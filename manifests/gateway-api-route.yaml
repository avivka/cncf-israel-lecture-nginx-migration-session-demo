---
# gateway-api-route.yaml — Optional: Gateway API resources
# Shows how to adopt Gateway API alongside existing Ingress resources
# Traefik serves both APIs on the same instance
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: demo-gateway
  namespace: demo
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo-gateway-route
  namespace: demo
spec:
  parentRefs:
    - name: demo-gateway
      namespace: demo
  hostnames:
    - gateway.demo.cncf-migration.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: echo-server
          port: 80
