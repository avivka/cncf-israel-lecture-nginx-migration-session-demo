---
# ingress-nginx-annotated.yaml — Annotated Ingress (S1 tier)
# Uses common NGINX annotations: ssl-redirect, basic auth, proxy-body-size
# These are the annotations Traefik's NGINX provider translates automatically
# Host matches a second Azure DNS record
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: echo-annotated
  namespace: demo
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "Authentication Required"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - host: secure.demo.cncf-migration.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: echo-server
                port:
                  number: 80
